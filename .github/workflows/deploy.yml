name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install dependencies and build TypeScript
      - name: Install dependencies and build
        run: |
          echo "📦 Installing dependencies..."
          npm install

          echo "🔨 Building TypeScript..."
          npm run build

          echo "🧾 Checking dist folder..."
          if [ -d "dist" ]; then
            echo "✅ dist folder found. Contents:"
            ls -la dist
          else
            echo "❌ dist folder not found! Build failed."
            exit 1
          fi

      # 3. Prepare deploy folder
      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r dist deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          echo "✅ Deploy folder prepared. Contents:"
          ls -la deploy

      # 4. Upload build to server
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/*"
          target: /root/telegram-bot
          overwrite: true

      # 5. SSH into server and restart bot
      - name: Deploy and restart bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/telegram-bot

            echo "📥 Installing production dependencies..."
            npm install --omit=dev

            echo "🔄 Restarting bot with PM2 using start:all..."
            pm2 restart telegram-bot || pm2 start npm --name "telegram-bot" -- run start:all

            echo "✅ Deployment completed!"
            pm2 status telegram-bot
